[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mission-ai"
version = "0.1.0"
authors = [
  { name="Senior Python Engineer", email="engineer@example.com" },
]
description = "Core engine to process daily mission content into video/caption assets."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mission-ai = "mission_ai.cli.main:main"
